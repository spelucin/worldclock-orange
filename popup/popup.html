<!DOCTYPE html>
<html lang="en" data-accent="orange" data-mode="light">
<head>
  <meta charset="utf-8">
  <title>WorkClock Orange</title>
  <link rel="stylesheet" href="../lib/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3.2 1.8"/>
          </svg>
        </span>
        <span class="brand-name">WorkClock Orange</span>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" data-i18n-title="changeTheme" data-i18n-aria="changeTheme" aria-label="Change theme">
          <svg class="ic-theme ic-system" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
          <svg class="ic-theme ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-theme ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings" aria-label="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="compare">
      <div class="clock local">
        <span class="clock-label">
          <span class="status-dot muted" id="localWork" aria-hidden="true"></span>
          <span data-i18n="yourZone">Your zone</span>
        </span>
        <span class="clock-zone" id="localZone">—</span>
        <span class="clock-time local-time" id="localTime">--:--</span>
        <span class="clock-date" id="localDate"></span>
      </div>

      <div class="diff">
        <div class="diff-body">
          <span class="diff-badge" id="diff">0h</span>
          <span class="diff-sub" id="diffNote">Same time</span>
        </div>
      </div>

      <div class="clock remote">
        <span class="clock-label">
          <span class="status-dot muted" id="remoteWork" hidden aria-hidden="true"></span>
          <span id="remoteLabel" data-i18n="location">Location</span>
        </span>
        <span class="clock-zone" id="remoteName">—</span>
        <span class="clock-time remote-time" id="remoteTime">--:--</span>
        <span class="clock-date" id="remoteDate"></span>
      </div>
    </section>

    <section class="locations">
      <div class="section-head">
        <span class="section-title" data-i18n="locations">Locations</span>
        <span class="section-count" id="locCount">0</span>
        <button id="addBtn" class="add-btn" data-i18n-aria="add" aria-label="Add location">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="add">Add</span>
        </button>
      </div>

      <div class="search-wrap" id="searchWrap" hidden></div>

      <div class="location-list" id="locationList"></div>

      <div class="empty-state" id="emptyState" hidden>
        <span class="empty-icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>
        </span>
        <p class="empty-title" data-i18n="emptyTitle">No locations yet</p>
        <p class="empty-text" data-i18n="emptyText">Add cities to compare times and working hours instantly.</p>
        <button id="emptyAddBtn" class="btn-primary" data-i18n="addFirst">Add first location</button>
      </div>
    </section>

  </main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
